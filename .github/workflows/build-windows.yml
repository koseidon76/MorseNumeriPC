name: Build MorseNumeriPC for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'MorseNumeriPC.py'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller soundcard numpy

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name MorseNumeriPC MorseNumeriPC.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MorseNumeriPC-Windows
          path: dist/MorseNumeriPC.exe
